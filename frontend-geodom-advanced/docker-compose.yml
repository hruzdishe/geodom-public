services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_API_REQUEST_TIMEOUT_MS: ${VITE_API_REQUEST_TIMEOUT_MS:-15000}
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
        VITE_LOCAL_MEDIA_BASE_URL: ${VITE_LOCAL_MEDIA_BASE_URL:-/media}
        VITE_ALLOW_UNVERIFIED_LOCAL_MEDIA: ${VITE_ALLOW_UNVERIFIED_LOCAL_MEDIA:-false}
    ports:
      - "${GEODOM_FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    volumes:
      - ./public/media:/usr/share/nginx/html/media:ro
